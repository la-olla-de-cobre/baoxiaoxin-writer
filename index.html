<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>学习通 - 输入测试</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: #f5f7fa;
    color: #333;
    font-family: -apple-system, BlinkMacSystemFont, "Microsoft YaHei", sans-serif;
  }
  main {
    width: min(520px, calc(100% - 32px));
    padding: 32px;
    background: #fff;
    border-radius: 8px;
    box-shadow: 0 4px 18px rgb(0 0 0 / 8%);
  }
  h1 { margin: 0 0 28px; color: #3b82f6; font-size: 24px; text-align: center; }
  .article {
    margin: 0 0 24px;
    padding: 16px;
    border-radius: 4px;
    background: #f5f7fa;
    line-height: 1.9;
  }
  .article h2 { margin: 0 0 8px; font-size: 16px; }
  .article p { margin: 0; }
  label { display: block; margin-bottom: 10px; }
  textarea {
    width: 100%;
    padding: 12px;
    border: 1px solid #d9d9d9;
    border-radius: 4px;
    font: inherit;
    resize: vertical;
  }
  textarea:focus { outline: none; border-color: #3b82f6; }
  #paste-message { min-height: 1.5em; margin: 10px 0 0; color: #e24a4a; font-size: 14px; }
</style>
</head>
<body>
  <main>
    <h1>学习通 - 输入测试</h1>
    <section class="article">
      <h2>《岳阳楼记》节选</h2>
      <p>庆历四年春，滕子京谪守巴陵郡。越明年，政通人和，百废具兴。乃重修岳阳楼，增其旧制，刻唐贤今人诗赋于其上。属予作文以记之。予观夫巴陵胜状，在洞庭一湖。衔远山，吞长江，浩浩汤汤，横无际涯；朝晖夕阴，气象万千。此则岳阳楼之大观也，前人之述备矣。</p>
    </section>
    <label for="no-paste-input">请手动输入上方 100 字</label>
    <textarea id="no-paste-input" rows="6" autocomplete="off" placeholder="请手动输入"></textarea>
    <p id="paste-message" aria-live="polite"></p>
  </main>

  <script>
    const input = document.getElementById('no-paste-input');
    const message = document.getElementById('paste-message');

    function blockPaste(event) {
      event.preventDefault();
      message.textContent = '不允许粘贴，请手动输入。';
    }

    input.addEventListener('paste', blockPaste);
    input.addEventListener('drop', blockPaste);
    input.addEventListener('contextmenu', blockPaste);
    input.addEventListener('input', () => { message.textContent = ''; });
  </script>
</body>
</html>
