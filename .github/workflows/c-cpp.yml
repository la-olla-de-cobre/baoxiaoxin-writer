name: Windows build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
    - name: Install MinGW
      uses: egor-tensin/setup-mingw@v2
      with:
        platform: x86
    - name: Build
      shell: cmd
      run: mingw32-make TARGET=KeyboardSim.exe
